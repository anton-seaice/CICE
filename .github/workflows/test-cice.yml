name: GHActions

# This workflow is triggered on pushes, pull-requeust, and releases
# ghactions* branch names will trigger this to support development testing
# The shared steps come from the composite actions in the icepack submodule (icepack/.github/actions)

on:
  push:
    branches:
      - main
      - 'CICE*'
      - 'ghactions*'
  pull_request:
  release:
    types:
      - created

# Establish a secure, read-only baseline for the repository token
permissions:
  contents: read

defaults:
  run:
    shell: /bin/csh -e {0}

jobs:
  build:
    name: "CICETesting"
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false   # <-- Keeps other matrix jobs running if one fails
      matrix:
        os: [macos-latest, ubuntu-latest, macos-15]
        include:
          - os: macos-latest
            envdef: macos
            testid: M00
            testsuites: "travis_suite"
            experimental: true
          - os: macos-15
            envdef: macos
            testid: M15
            testsuites: "travis_suite"
            experimental: false
          - os: ubuntu-latest
            envdef: linux
            testid: L00
            testsuites: "travis_suite"
            experimental: true
    steps:
      - name: clone
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: 'recursive'
      - name: check for tabs
        uses: ./icepack/.github/actions/check-tabs
        with:
          paths: cicecore
      - name: setup conda env
        uses: ./icepack/.github/actions/setup-env
        with:
          model: cice
      - name: run hello world unit test
        run: |
          ./cice.setup -m conda -e ${{ matrix.envdef }} --test unittest --pes 2x1 -s helloworld --testid hw01
          cd *helloworld*hw01
          ./cice.build
          ./cice.run
      - name: check cice compile
        run: |
          ./cice.setup -m conda -e ${{ matrix.envdef }} -c case1 --pes 2x2 -s diag1
          cd case1
          ./cice.build
      - name: download input data
        uses: ./icepack/.github/actions/get-input-data
        with:
          model: cice
          files: |
            https://zenodo.org/records/3728358/files/CICE_data_gx3_grid_ic-20200320.tar.gz bd46ec49580ab11b8d4b05e381f180f5d25c04c137430e0f69bfdd48a2d02485
            https://zenodo.org/records/10419929/files/CICE_data_gx3_forcing_JRA55_200501_20231220.tar.gz 9b6c3781b46017de6f4762a1ec5283ac47393de17f8bb9488738e470ac3263a8
      - name: link forcing
        run: |
          cd $HOME/cice-dirs/input/CICE_data/forcing/gx3/JRA55/8XDAILY
          ln -s JRA55_gx3_03hr_forcing_200501.nc JRA55_gx3_03hr_forcing_2005.nc
      - name: run suite
        uses: ./icepack/.github/actions/run-suite
        with:
          model: cice
          envdef: ${{ matrix.envdef }}
          testsuites: ${{ matrix.testsuites }}
          testid: ${{ matrix.testid }}
